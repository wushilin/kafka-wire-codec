[package]
name = "kafka-codegen"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "kafka-codegen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dialoguer = "0.11"
indicatif = "0.17"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
heck = "0.5"
